<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LearnHub - Media Pembelajaran</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="bg-gradient-to-br from-blue-50 to-indigo-100">
    <div class="min-h-screen flex items-center justify-center p-4">
      <div
        class="bg-white rounded-2xl shadow-2xl overflow-hidden w-full max-w-md"
      >
        <!-- Header Gradient -->
        <div
          class="bg-gradient-to-r from-blue-600 to-indigo-600 px-6 py-12 text-white"
        >
          <h1 class="text-3xl font-bold mb-2">LearnHub</h1>
          <p class="text-blue-100">Platform Pembelajaran Interaktif</p>
        </div>

        <!-- Login Form -->
        <div class="px-6 py-8">
          <form id="loginForm">
            <!-- Email Input -->
            <div class="mb-5">
              <label class="block text-gray-700 font-semibold mb-2"
                >Email</label
              >
              <input
                type="email"
                id="email"
                placeholder="nama@email.com"
                class="w-full px-4 py-2 border-2 border-gray-200 rounded-lg focus:border-blue-500 focus:outline-none transition"
                required
              />
            </div>

            <!-- Password Input -->
            <div class="mb-6">
              <label class="block text-gray-700 font-semibold mb-2"
                >Password</label
              >
              <input
                type="password"
                id="password"
                placeholder="Masukkan password"
                class="w-full px-4 py-2 border-2 border-gray-200 rounded-lg focus:border-blue-500 focus:outline-none transition"
                required
              />
            </div>

            <!-- Remember Me -->
            <div class="flex items-center mb-6">
              <input type="checkbox" id="remember" class="w-4 h-4 rounded" />
              <label for="remember" class="ml-2 text-gray-600 text-sm"
                >Ingat saya</label
              >
            </div>

            <!-- Login Button -->
            <button
              type="submit"
              class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold py-2 rounded-lg hover:shadow-lg transition transform hover:scale-105 duration-200"
            >
              Masuk
            </button>
          </form>

          <!-- Demo Credentials -->
          <div class="mt-6 p-4 bg-blue-50 rounded-lg border border-blue-200">
            <p class="text-xs text-gray-600 mb-2 font-semibold">Demo Login:</p>
            <p class="text-xs text-gray-700">
              Email: <span class="font-mono text-blue-600">siswa@mail.com</span>
            </p>
            <p class="text-xs text-gray-700">
              Password: <span class="font-mono text-blue-600">123456</span>
            </p>
          </div>

          <!-- Background Pattern -->
          <div
            id="notification"
            class="mt-4 hidden p-3 rounded-lg text-sm"
          ></div>
        </div>
      </div>
    </div>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;

          // Demo validation
          if (email === "siswa@mail.com" && password === "123456") {
            // Simpan session
            localStorage.setItem(
              "userLogin",
              JSON.stringify({
                email: email,
                name: "Gusti Rizky Ananda",
              }),
            );

            // Redirect ke dashboard
            window.location.href = "dashboard.html";
          } else {
            const notif = document.getElementById("notification");
            notif.classList.remove("hidden");
            notif.className =
              "mt-4 p-3 rounded-lg text-sm bg-red-100 text-red-700 border border-red-300";
            notif.innerText = "Email atau password salah!";
          }
        });
    </script>
  </body>
</html>
